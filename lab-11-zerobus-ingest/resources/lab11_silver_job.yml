resources:
  jobs:
    oles0305_lab11_silver:
      name: oles0305_lab11_silver

      trigger:
        pause_status: PAUSED
        table_update:
          table_names:
            - ${var.catalog}.${var.bronze_schema}.${var.bronze_table}
          wait_after_last_change_seconds: 60

      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/01_silver.py
            base_parameters:
              catalog_name: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              bronze_table: ${var.bronze_table}
              silver_schema: ${var.silver_schema}
              silver_table: ${var.silver_table}
