resources:
  jobs:
    job_oles0305_lab7_formula1:
      name: oles0305_lab7_formula1

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: silver_schema
          default: ${var.schema_name}_silver
        - name: gold_schema
          default: ${var.schema_name}_gold
        - name: src_path
          default: ${workspace.file_path}/src

      tasks:
        - task_key: bronze_silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_oles0305_f1_lab07.id}

        - task_key: apply_constraints
          depends_on:
            - task_key: bronze_silver_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/04_apply_delta_constraints.py

        - task_key: gold_facts_job
          depends_on:
            - task_key: apply_constraints
          notebook_task:
            notebook_path: ../src/notebooks/01_build_facts.py

        - task_key: gold_dims_job
          depends_on:
            - task_key: apply_constraints
          notebook_task:
            notebook_path: ../src/notebooks/02_build_dims.py

        - task_key: gold_aggs_job
          depends_on:
            - task_key: gold_facts_job
            - task_key: gold_dims_job
          notebook_task:
            notebook_path: ../src/notebooks/03_build_aggs.py

        - task_key: dq_gate
          email_notifications:
            on_failure:
              - oles0305@gmail.com
          depends_on:
            - task_key: gold_aggs_job
          environment_key: dq_env
          spark_python_task:
            python_file: ../tests/run_dq_tests.py
            parameters:
              - ${workspace.file_path}
              - ${var.catalog_name}
              - ${var.schema_name}


      environments:
        - environment_key: dq_env
          spec:
            environment_version: "6"
            dependencies:
              - pytest
              - pyyaml
              - databricks-labs-dqx