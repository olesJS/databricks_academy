name: lab07-ci

on:
  pull_request:
    paths:
      - "lab-07-data-quality/**"
      - ".github/workflows/lab07-ci.yml"
  push:
    branches: [master, lab-07]
    paths:
      - "lab-07-data-quality/**"
      - ".github/workflows/lab07-ci.yml"

defaults:
  run:
    working-directory: lab-07-data-quality

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pyspark==4.0.*" pytest chispa

      - name: Unit tests
        run: pytest tests/unit -v
