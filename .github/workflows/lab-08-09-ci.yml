name: lab-08-09-ci

on:
  pull_request:
    branches: [master, main]
    paths:
      - "lab-08-ci-cd/**"
      - "lab-09-rest-api-automation/**"
      - ".github/workflows/lab-08-09-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab-08-ci-cd

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pyspark==4.0.*" pytest chispa

      - name: Unit tests (Lab 8)
        run: pytest tests/unit -v

  cli-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lab-09-rest-api-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Unit tests (Lab 9)
        run: pytest -v

  bundle-validate:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10

    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev
