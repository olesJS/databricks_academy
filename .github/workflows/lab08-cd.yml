name: lab08-cd

on:
  push:
    branches: [master]
    paths:
      - "lab-08-ci-cd/**"
      - ".github/workflows/lab08-cd.yml"
  workflow_dispatch:

concurrency:
  group: lab08-production-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: lab-08-ci-cd

jobs:
  deploy_prod:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: azure-client-secret
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle
        run: databricks bundle deploy -t prod

      - name: Run main Job in PROD
        run: databricks bundle run job_oles0305_lab8_formula1 -t prod
