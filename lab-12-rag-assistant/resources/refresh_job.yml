# Knowledge-base refresh: 01_ingest -> 02_chunk -> 03_vector_index.
# No cluster is specified, so tasks run on serverless compute.
resources:
  jobs:
    f1_rag_refresh:
      name: f1_rag_refresh
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              raw_volume: ${var.raw_volume}

        - task_key: chunk
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/02_chunk.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              raw_volume: ${var.raw_volume}

        - task_key: vector_index
          depends_on:
            - task_key: chunk
          notebook_task:
            notebook_path: ../notebooks/03_vector_index.ipynb
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              reader_group: ${var.reader_group}
